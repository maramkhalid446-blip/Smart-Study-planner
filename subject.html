<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subjects</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="hero small-hero">

  <div class="hero-content">

    <div>
      <p class="tag">SUBJECT MANAGEMENT</p>
      <h1>Your Study Notes</h1>
    </div>

    <button id="themeToggle" class="theme-toggle">
      🌙
    </button>

  </div>

</header>

<nav class="navbar">

  <a href="index.html">Home</a>
  <a href="subject.html" class="active">Subjects</a>
  <a href="resources.html">Resources</a>
  <a href="python.html">Python Lab</a>

</nav>

<main class="container">

  <section class="card fade-up">

    <div class="section-title">
      <h2>Add Subject Summary</h2>
      <p>Upload materials and save quick revision notes.</p>
    </div>

    <div class="study-form">

      <div class="input-group">
        <label for="subjectTitle">Subject Name</label>
        <input type="text" id="subjectTitle" />
      </div>

      <div class="input-group">
        <label for="pptFile">Upload PPT / PDF</label>
        <input type="file" id="pptFile" />
      </div>

      <div class="input-group">
        <label for="summaryText">Summary</label>
        <textarea id="summaryText"></textarea>
      </div>

      <button onclick="saveSummary()" class="primary-btn">
        Save Summary
      </button>

    </div>

  </section>

  <section class="card fade-up delay-1">

    <div class="section-title">
      <h2>Saved Summaries</h2>
    </div>

    <div id="summaryContainer"></div>

  </section>

</main>

<script src="script.js"></script>

</body>
</html>
